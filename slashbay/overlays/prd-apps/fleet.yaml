# Fleet configuration for prd-apps
# Self-contained overlay - Fleet path: slashbay/overlays/prd-apps
# Uses same pattern as coder/overlays/prd-apps
apiVersion: fleet.cattle.io/v1alpha1
kind: Bundle
metadata:
  name: slashbay-prd-apps
  labels:
    fleet.cattle.io/bundle-name: slashbay-prd-apps
spec:
  targetRestrictions:
    - clusterSelector:
        matchLabels:
          management.cattle.io/cluster-display-name: prd-apps
